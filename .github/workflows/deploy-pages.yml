name: Publier CR3@TIX ADVENTURE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restaurer les deux grandes images
        run: |
          cat .github/assets/world.png.part-* > public/game/world.png
          cat .github/assets/og.png.part-* > public/og.png

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le jeu
        run: npm run build:pages

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Préparer les fichiers publiés
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
